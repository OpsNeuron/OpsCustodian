openapi: 3.1.0
info:
  title: OpsCustodian Control Plane API
  version: 0.5.0-alpha
  description: Organization inventory, snapshot ingestion, and effective-access API.
x-opscustodian-api-version: opscustodian.dev/control-plane/v1alpha1
servers:
  - url: http://127.0.0.1:8080
    description: Future loopback-only development server
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
  /readyz:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: Control plane dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: One or more required dependencies are not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /api/v1/contracts:
    get:
      operationId: getContracts
      x-opscustodian-required-scope: contracts:read
      responses:
        "200": { $ref: "#/components/responses/JSONSuccess" }
  /api/v1/snapshots:
    post:
      operationId: ingestSnapshot
      x-opscustodian-required-scope: snapshots:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentBOM" }
      responses:
        "201": { $ref: "#/components/responses/JSONSuccess" }
        "400": { $ref: "#/components/responses/APIError" }
        "409": { $ref: "#/components/responses/APIError" }
        "413": { $ref: "#/components/responses/APIError" }
        "415": { $ref: "#/components/responses/APIError" }
        "422": { $ref: "#/components/responses/APIError" }
  /api/v1/policy/evaluate:
    post:
      operationId: evaluatePolicy
      description: Evaluate a versioned Agent BOM policy input without persisting it.
      x-opscustodian-required-scope: policy:evaluate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyInput" }
      responses:
        "200":
          description: Explicit allow or deny policy decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyEvaluation" }
        "400": { $ref: "#/components/responses/APIError" }
        "413": { $ref: "#/components/responses/APIError" }
        "415": { $ref: "#/components/responses/APIError" }
        "422": { $ref: "#/components/responses/APIError" }
        "503": { $ref: "#/components/responses/APIError" }
  /api/v1/repositories:
    get:
      operationId: listRepositories
      x-opscustodian-required-scope: inventory:read
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/JSONSuccess" }
        "400": { $ref: "#/components/responses/APIError" }
  /api/v1/graph:
    get:
      operationId: getOrganizationGraph
      description: Page through latest repository subgraphs visible to the authenticated identity.
      x-opscustodian-required-scope: inventory:read
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: Latest graph material for an authorized page of repositories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationGraphPage" }
        "400": { $ref: "#/components/responses/APIError" }
  /api/v1/repositories/{repositoryId}/bom:
    get:
      operationId: getLatestRepositoryBOM
      x-opscustodian-required-scope: inventory:read
      parameters:
        - { $ref: "#/components/parameters/RepositoryID" }
      responses:
        "200": { $ref: "#/components/responses/JSONSuccess" }
        "400": { $ref: "#/components/responses/APIError" }
        "404": { $ref: "#/components/responses/APIError" }
  /api/v1/repositories/{repositoryId}/snapshots:
    get:
      operationId: listRepositorySnapshots
      x-opscustodian-required-scope: inventory:read
      parameters:
        - { $ref: "#/components/parameters/RepositoryID" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/JSONSuccess" }
        "400": { $ref: "#/components/responses/APIError" }
        "404": { $ref: "#/components/responses/APIError" }
  /api/v1/repositories/{repositoryId}/snapshots/{snapshotId}/bom:
    get:
      operationId: getRepositorySnapshotBOM
      x-opscustodian-required-scope: inventory:read
      parameters:
        - { $ref: "#/components/parameters/RepositoryID" }
        - { $ref: "#/components/parameters/SnapshotID" }
      responses:
        "200": { $ref: "#/components/responses/JSONSuccess" }
        "400": { $ref: "#/components/responses/APIError" }
        "404": { $ref: "#/components/responses/APIError" }
  /api/v1/repositories/{repositoryId}/drift:
    get:
      operationId: compareRepositorySnapshots
      description: Compare two immutable snapshots from the same repository using semantic drift analysis.
      x-opscustodian-required-scope: findings:read
      parameters:
        - { $ref: "#/components/parameters/RepositoryID" }
        - name: beforeSnapshotId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SnapshotID" }
        - name: afterSnapshotId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/SnapshotID" }
      responses:
        "200":
          description: Deterministic semantic drift report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriftResponse" }
        "400": { $ref: "#/components/responses/APIError" }
        "403": { $ref: "#/components/responses/APIError" }
        "404": { $ref: "#/components/responses/APIError" }
  /api/v1/findings:
    get:
      operationId: listFindings
      x-opscustodian-required-scope: findings:read
      parameters:
        - name: repositoryId
          in: query
          schema: { $ref: "#/components/schemas/RepositoryID" }
        - name: severity
          in: query
          schema: { enum: [info, low, medium, high, critical] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/JSONSuccess" }
        "400": { $ref: "#/components/responses/APIError" }
  /api/v1/finding-lifecycles:
    get:
      operationId: listFindingLifecycles
      x-opscustodian-required-scope: findings:read
      parameters:
        - name: repositoryId
          in: query
          schema: { $ref: "#/components/schemas/RepositoryID" }
        - name: severity
          in: query
          schema: { enum: [info, low, medium, high, critical] }
        - name: status
          in: query
          schema: { enum: [introduced, persisting, resolved] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/JSONSuccess" }
        "400": { $ref: "#/components/responses/APIError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: High-entropy token supplied through server environment configuration. Every API operation also requires its declared OpsCustodian scope.
  parameters:
    RepositoryID:
      name: repositoryId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/RepositoryID" }
    SnapshotID:
      name: snapshotId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SnapshotID" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque versioned keyset cursor returned by the previous page.
      schema: { type: string, maxLength: 700 }
  schemas:
    Readiness:
      type: object
      additionalProperties: false
      required: [status, components]
      properties:
        status: { enum: [ready, not-ready] }
        components:
          type: object
          additionalProperties: false
          required: [database, ingestion, github-auth]
          properties:
            database: { enum: [starting, ready, degraded, disabled] }
            ingestion: { enum: [starting, ready, degraded, disabled] }
            github-auth: { enum: [starting, ready, degraded, disabled] }
    AgentBOM:
      type: object
      description: Agent BOM document conforming to opscustodian.dev/v1alpha1.
      required: [apiVersion, kind, metadata, assets]
    PolicyInput:
      type: object
      additionalProperties: false
      required: [apiVersion, bom]
      properties:
        apiVersion: { const: opscustodian.dev/policy-input/v1alpha1 }
        bom: { $ref: "#/components/schemas/AgentBOM" }
        drift:
          type: object
          description: Optional semantic drift report conforming to the public policy input contract.
          additionalProperties: true
    PolicyEvaluation:
      type: object
      additionalProperties: false
      required: [apiVersion, value]
      properties:
        apiVersion: { const: opscustodian.dev/control-plane/v1alpha1 }
        value:
          type: object
          additionalProperties: false
          required: [allowed, decision]
          properties:
            allowed: { type: boolean }
            decision:
              type: object
              additionalProperties: false
              required: [deny, warn]
              properties:
                deny:
                  type: array
                  items: { type: object, additionalProperties: true }
                warn:
                  type: array
                  items: { type: object, additionalProperties: true }
    DriftResponse:
      type: object
      additionalProperties: false
      required: [apiVersion, value]
      properties:
        apiVersion: { const: opscustodian.dev/control-plane/v1alpha1 }
        value:
          type: object
          additionalProperties: false
          required: [beforeRevision, afterRevision, changes]
          properties:
            beforeRevision: { type: string }
            afterRevision: { type: string }
            changes:
              type: array
              items: { type: object, additionalProperties: true }
    OrganizationGraphPage:
      type: object
      additionalProperties: false
      required: [apiVersion, items]
      properties:
        apiVersion: { const: opscustodian.dev/control-plane/v1alpha1 }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [repositoryId, source, revision, assets, relationships, accessPaths]
            properties:
              repositoryId: { $ref: "#/components/schemas/RepositoryID" }
              source: { type: string }
              revision: { type: string }
              assets:
                type: array
                items: { type: object, additionalProperties: true }
              relationships:
                type: array
                items: { type: object, additionalProperties: true }
              accessPaths:
                type: array
                items: { type: object, additionalProperties: true }
        nextCursor: { type: string }
    RepositoryID:
      type: string
      pattern: ^repository-[0-9a-f]{16}$
    SnapshotID:
      type: string
      pattern: ^snapshot-[0-9a-f]{16}$
    APIError:
      type: object
      required: [apiVersion, error]
      properties:
        apiVersion: { const: opscustodian.dev/control-plane/v1alpha1 }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    JSONSuccess:
      description: Versioned successful response; concrete envelope depends on operation.
      content:
        application/json:
          schema:
            type: object
            required: [apiVersion]
            properties:
              apiVersion: { const: opscustodian.dev/control-plane/v1alpha1 }
            additionalProperties: true
    APIError:
      description: Public-safe API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
