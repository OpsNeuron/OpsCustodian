apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opscustodian-system
resources:
  - namespace.yaml
  - service-account.yaml
  - envoy-config.yaml
  - deployment.yaml
  - service.yaml
  - network-policy.yaml
  - pod-disruption-budget.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: opscustodian
      app.kubernetes.io/part-of: opscustodian
