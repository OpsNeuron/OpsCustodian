name: OpsCustodian

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  agentic-access-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect agentic access drift
        id: opscustodian
        uses: OpsNeuron/OpsCustodian@v0
        with:
          baseline-bom: .opscustodian/baseline.agentbom.json
          fail-on: high
          sarif-output: opscustodian.sarif

      - name: Upload OpsCustodian findings
        if: always() && hashFiles('opscustodian.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: opscustodian.sarif
          category: opscustodian-agentic-access
