apiVersion: apps/v1
kind: Deployment
metadata:
  name: opscustodian
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  template:
    spec:
      terminationGracePeriodSeconds: 45
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: opscustodian
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opscustodian
      containers:
        - name: opscustodian
          env:
            - name: OPSCUSTODIAN_SCHEDULER_LEASE_TTL
              value: 45s
            - name: OPSCUSTODIAN_SCHEDULER_RENEW_INTERVAL
              value: 15s
