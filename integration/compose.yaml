name: opscustodian-integration

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: opscustodian
      POSTGRES_USER: opscustodian
      POSTGRES_PASSWORD: ${OPSCUSTODIAN_INTEGRATION_DATABASE_PASSWORD:?set an ephemeral integration database password}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U opscustodian -d opscustodian]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [integration]

  postgres-restore:
    image: postgres:17.4-alpine
    profiles: [recovery]
    environment:
      POSTGRES_DB: opscustodian
      POSTGRES_USER: opscustodian
      POSTGRES_PASSWORD: ${OPSCUSTODIAN_INTEGRATION_DATABASE_PASSWORD:?set an ephemeral integration database password}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U opscustodian -d opscustodian]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-restore-data:/var/lib/postgresql/data
    networks: [integration]

  postgres-upgrade:
    image: postgres:17.4-alpine
    profiles: [upgrade]
    environment:
      POSTGRES_DB: opscustodian
      POSTGRES_USER: opscustodian
      POSTGRES_PASSWORD: ${OPSCUSTODIAN_INTEGRATION_DATABASE_PASSWORD:?set an ephemeral integration database password}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U opscustodian -d opscustodian]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-upgrade-data:/var/lib/postgresql/data
    networks: [integration]

  collector:
    image: otel/opentelemetry-collector:0.123.0
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [integration]

  opscustodian:
    build:
      context: ..
      dockerfile: Dockerfile
    entrypoint: [/usr/local/bin/opscustodian]
    command: [serve]
    environment:
      OPSCUSTODIAN_ORGANIZATION_ID: organization-0123456789abcdef
      OPSCUSTODIAN_ORGANIZATION_DISPLAY_NAME: Integration Fixture
      OPSCUSTODIAN_DATABASE_DSN: postgres://opscustodian:${OPSCUSTODIAN_INTEGRATION_DATABASE_PASSWORD}@postgres:5432/opscustodian?sslmode=disable
      OPSCUSTODIAN_DATABASE_ALLOW_INSECURE: "true"
      OPSCUSTODIAN_DATABASE_MIGRATE: "true"
      OPSCUSTODIAN_API_CREDENTIALS: >-
        [{"id":"integration-operator","token":"${OPSCUSTODIAN_INTEGRATION_API_TOKEN:?set an ephemeral integration API token}","scopes":["control-plane:read","snapshots:write","policy:evaluate","audit:read"],"repositories":["repository-d19526261c01a8e3","repository-4b70fe32f822b795"]}]
      OPSCUSTODIAN_REPOSITORY_SET_FILE: /config/repository-set.json
      OPSCUSTODIAN_POLICY_PATH: /policies
      OPSCUSTODIAN_POLICY_TIMEOUT: 5s
      OPSCUSTODIAN_SNAPSHOT_RETENTION: ${OPSCUSTODIAN_INTEGRATION_SNAPSHOT_RETENTION:-4320h}
      OPSCUSTODIAN_SNAPSHOT_MINIMUM_PER_REPOSITORY: ${OPSCUSTODIAN_INTEGRATION_SNAPSHOT_MINIMUM:-10}
      OPSCUSTODIAN_SNAPSHOT_PRUNE_INTERVAL: ${OPSCUSTODIAN_INTEGRATION_SNAPSHOT_PRUNE_INTERVAL:-24h}
      OPSCUSTODIAN_SNAPSHOT_PRUNE_BATCH: ${OPSCUSTODIAN_INTEGRATION_SNAPSHOT_PRUNE_BATCH:-500}
    depends_on:
      postgres:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:8080/healthz | grep -q '"status":"ok"']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./repository-set.json:/config/repository-set.json:ro
      - ../examples/scan-input:/fixtures/scan-input:ro
      - ../examples/scope-expansion:/fixtures/scope-expansion:ro
      - ../policies/builtin:/policies:ro
      - ./policy-input.json:/config/policy-input.json:ro
      - integration-output:/work
    working_dir: /work
    networks: [integration]

  opscustodian-restore:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: [recovery]
    entrypoint: [/usr/local/bin/opscustodian]
    command: [serve]
    environment:
      OPSCUSTODIAN_ORGANIZATION_ID: organization-0123456789abcdef
      OPSCUSTODIAN_ORGANIZATION_DISPLAY_NAME: Integration Fixture
      OPSCUSTODIAN_DATABASE_DSN: postgres://opscustodian:${OPSCUSTODIAN_INTEGRATION_DATABASE_PASSWORD}@postgres-restore:5432/opscustodian?sslmode=disable
      OPSCUSTODIAN_DATABASE_ALLOW_INSECURE: "true"
      OPSCUSTODIAN_DATABASE_MIGRATE: "true"
      OPSCUSTODIAN_API_CREDENTIALS: >-
        [{"id":"integration-operator","token":"${OPSCUSTODIAN_INTEGRATION_API_TOKEN:?set an ephemeral integration API token}","scopes":["control-plane:read","audit:read"]}]
    depends_on:
      postgres-restore:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:8080/readyz | grep -q '"status":"ready"']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [integration]

  opscustodian-upgrade-source:
    image: ${OPSCUSTODIAN_INTEGRATION_UPGRADE_SOURCE_IMAGE:-opscustodian-integration-upgrade-source:local}
    profiles: [upgrade]
    entrypoint: [/usr/local/bin/opscustodian]
    command: [serve]
    environment:
      OPSCUSTODIAN_ORGANIZATION_ID: organization-0123456789abcdef
      OPSCUSTODIAN_ORGANIZATION_DISPLAY_NAME: Integration Fixture
      OPSCUSTODIAN_DATABASE_DSN: postgres://opscustodian:${OPSCUSTODIAN_INTEGRATION_DATABASE_PASSWORD}@postgres-upgrade:5432/opscustodian?sslmode=disable
      OPSCUSTODIAN_DATABASE_ALLOW_INSECURE: "true"
      OPSCUSTODIAN_DATABASE_MIGRATE: "true"
      OPSCUSTODIAN_API_CREDENTIALS: >-
        [{"id":"integration-operator","token":"${OPSCUSTODIAN_INTEGRATION_API_TOKEN:?set an ephemeral integration API token}","scopes":["control-plane:read","snapshots:write"]}]
      OPSCUSTODIAN_REPOSITORY_SET_FILE: /config/repository-set.json
    depends_on:
      postgres-upgrade:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:8080/readyz | grep -q '"status":"ready"']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./repository-set.json:/config/repository-set.json:ro
      - ../examples/scan-input:/fixtures/scan-input:ro
    networks: [integration]

  opscustodian-upgrade-target:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: [upgrade]
    entrypoint: [/usr/local/bin/opscustodian]
    command: [serve]
    environment:
      OPSCUSTODIAN_ORGANIZATION_ID: organization-0123456789abcdef
      OPSCUSTODIAN_ORGANIZATION_DISPLAY_NAME: Integration Fixture
      OPSCUSTODIAN_DATABASE_DSN: postgres://opscustodian:${OPSCUSTODIAN_INTEGRATION_DATABASE_PASSWORD}@postgres-upgrade:5432/opscustodian?sslmode=disable
      OPSCUSTODIAN_DATABASE_ALLOW_INSECURE: "true"
      OPSCUSTODIAN_DATABASE_MIGRATE: "true"
      OPSCUSTODIAN_API_CREDENTIALS: >-
        [{"id":"integration-operator","token":"${OPSCUSTODIAN_INTEGRATION_API_TOKEN:?set an ephemeral integration API token}","scopes":["control-plane:read","audit:read"]}]
    depends_on:
      postgres-upgrade:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:8080/readyz | grep -q '"status":"ready"']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [integration]

  opa:
    image: openpolicyagent/opa:1.21.3-static@sha256:bf27411c17e72f3d16063725a74c69f711fb267eb9a4cebdae78028b72adc847
    profiles: [verify]
    entrypoint: [/opa]
    command: [test, /policies, -v]
    volumes:
      - ../policies/builtin:/policies:ro
    networks: [integration]

networks:
  integration:
    internal: true

volumes:
  postgres-data:
  postgres-restore-data:
  postgres-upgrade-data:
  integration-output:
