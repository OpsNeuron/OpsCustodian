name: privileged review automation

on:
  pull_request_target:
    types: [opened, synchronize]
  workflow_run:
    workflows: [Untrusted pull request tests]
    types: [completed]

permissions:
  contents: write
  issues: write

jobs:
  delegate:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit
  external-audit:
    permissions:
      contents: read
    uses: acme/security/.github/workflows/audit.yml@main
    secrets:
      audit-token: ${{ secrets.PROD_KUBECONFIG }}
  respond:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Unsafe checkout fixture
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Unsafe artifact fixture
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
      - name: Record review result
        shell: bash
        run: |
          echo "Unsafe fixture title: ${{ github.event.pull_request.title }}"
          echo "Fixture only; do not copy this privileged trigger pattern without a threat review."
