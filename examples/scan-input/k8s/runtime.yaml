apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent
  namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-remediator
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-remediator
  template:
    metadata:
      labels:
        app: incident-remediator
    spec:
      serviceAccountName: ops-agent
      containers:
        - name: agent
          image: example.invalid/incident-remediator:v1
