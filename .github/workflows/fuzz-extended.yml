name: Extended security fuzzing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: credentials
            package: ./internal/server
            target: FuzzParseBearerCredentialsJSON
          - name: repository-set
            package: ./internal/ingestion
            target: FuzzParseRepositorySet
          - name: policy-response
            package: ./internal/policy
            target: FuzzDecodeOPAResponse
          - name: github-actions
            package: ./internal/parsers/githubactions
            target: FuzzParseWorkflow
          - name: kubernetes
            package: ./internal/parsers/kubernetes
            target: FuzzParseManifest
          - name: mcp
            package: ./internal/parsers/mcp
            target: FuzzParseConfiguration
          - name: agent-markdown
            package: ./internal/parsers/agentmarkdown
            target: FuzzParseAgentMarkdown
          - name: agentic-workflows
            package: ./internal/parsers/ghaw
            target: FuzzParseAgenticWorkflow
          - name: pagination
            package: ./internal/server
            target: FuzzRequestPage
          - name: query-filter
            package: ./internal/server
            target: FuzzRequestBoundedQueryValue
          - name: query-allowlist
            package: ./internal/server
            target: FuzzRejectUnknownQueryParameters
          - name: audit-envelope
            package: ./internal/audit
            target: FuzzValidateEvent
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run extended fuzz campaign
        shell: bash
        env:
          FUZZ_NAME: ${{ matrix.name }}
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          log="evidence/${FUZZ_NAME}.log"
          set +e
          go test "${FUZZ_PACKAGE}" -run='^$' -fuzz="^${FUZZ_TARGET}$" -fuzztime=2m -parallel=4 2>&1 | tee "${log}"
          test_status=${PIPESTATUS[0]}
          set -e
          outcome=passed
          if [[ ${test_status} -ne 0 ]]; then outcome=failed; fi
          {
            printf 'repository=%s\n' "${GITHUB_REPOSITORY}"
            printf 'commit=%s\n' "${GITHUB_SHA}"
            printf 'workflow_run=%s\n' "${GITHUB_RUN_ID}"
            printf 'workflow_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}"
            printf 'target=%s\n' "${FUZZ_TARGET}"
            printf 'package=%s\n' "${FUZZ_PACKAGE}"
            printf 'duration=2m\n'
            printf 'parallelism=4\n'
            printf 'outcome=%s\n' "${outcome}"
          } > "evidence/${FUZZ_NAME}.manifest"
          (cd evidence && sha256sum "${FUZZ_NAME}.log" "${FUZZ_NAME}.manifest" > SHA256SUMS)
          exit "${test_status}"
      - name: Retain fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-evidence-${{ matrix.name }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
