apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent
  namespace: production
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-remediator
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-remediator
  template:
    metadata:
      labels:
        app: incident-remediator
    spec:
      serviceAccountName: ops-agent
      automountServiceAccountToken: true
      containers:
        - name: agent
          image: example.invalid/incident-remediator:v1
          volumeMounts:
            - name: github-api-token
              mountPath: /var/run/secrets/agent
              readOnly: true
      volumes:
        - name: github-api-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: github-automation
                  expirationSeconds: 86400
                  path: token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
    resourceNames: ["incident-remediator"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-reader-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: ops-agent
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-platform-admin
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles"]
    verbs: ["bind", "escalate"]
  - apiGroups: [""]
    resources: ["users", "groups", "serviceaccounts"]
    verbs: ["impersonate"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["/healthz", "/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-platform-admin-binding
subjects:
  - kind: ServiceAccount
    name: ops-agent
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-platform-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-support
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - nonResourceURLs: ["/readyz"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: namespace-support-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: ops-agent
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-support
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-observe-pods
  labels:
    opscustodian.dev/aggregate-to-agent-observer: "true"
    opscustodian.dev/access-tier: reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-observe-jobs
  labels:
    opscustodian.dev/aggregate-to-agent-observer: "true"
    opscustodian.dev/access-tier: reader
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-observer
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        opscustodian.dev/aggregate-to-agent-observer: "true"
    - matchExpressions:
        - key: opscustodian.dev/access-tier
          operator: In
          values: ["reader"]
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-observer-binding
subjects:
  - kind: ServiceAccount
    name: ops-agent
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-observer
