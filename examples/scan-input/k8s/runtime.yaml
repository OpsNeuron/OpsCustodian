apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent
  namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-remediator
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-remediator
  template:
    metadata:
      labels:
        app: incident-remediator
    spec:
      serviceAccountName: ops-agent
      containers:
        - name: agent
          image: example.invalid/incident-remediator:v1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incident-reader
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: incident-reader-binding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: ops-agent
    namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: incident-reader
