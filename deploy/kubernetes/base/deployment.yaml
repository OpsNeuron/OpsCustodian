apiVersion: apps/v1
kind: Deployment
metadata:
  name: opscustodian
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opscustodian
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opscustodian
        app.kubernetes.io/part-of: opscustodian
    spec:
      serviceAccountName: opscustodian
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: opscustodian
          image: ghcr.io/opsneuron/opscustodian:REPLACE_VERSION
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/opscustodian]
          args: [serve]
          env:
            - name: OPSCUSTODIAN_ORGANIZATION_ID
              value: REPLACE_ORGANIZATION_ID
            - name: OPSCUSTODIAN_ORGANIZATION_DISPLAY_NAME
              value: REPLACE_ORGANIZATION_DISPLAY_NAME
            - name: OPSCUSTODIAN_DATABASE_DSN
              valueFrom:
                secretKeyRef: { name: opscustodian-secrets, key: database-dsn }
            - name: OPSCUSTODIAN_DATABASE_ALLOW_INSECURE
              value: "false"
            - name: OPSCUSTODIAN_DATABASE_MIGRATE
              value: "true"
            - name: OPSCUSTODIAN_API_TOKEN_ID
              value: kubernetes-bootstrap
            - name: OPSCUSTODIAN_API_TOKEN
              valueFrom:
                secretKeyRef: { name: opscustodian-secrets, key: api-token }
            - name: OPSCUSTODIAN_API_SCOPES
              value: control-plane:read,snapshots:write
          ports:
            - { name: loopback-http, containerPort: 8080, protocol: TCP }
          readinessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            exec:
              command: [wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
        - name: envoy
          image: envoyproxy/envoy:v1.33.2
          imagePullPolicy: IfNotPresent
          args: [-c, /etc/envoy/envoy.yaml, --log-level, warning]
          ports:
            - { name: tls, containerPort: 8443, protocol: TCP }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy, readOnly: true }
            - { name: tls, mountPath: /etc/opscustodian/tls, readOnly: true }
            - { name: envoy-temporary, mountPath: /tmp }
      volumes:
        - name: temporary
          emptyDir: { sizeLimit: 256Mi }
        - name: envoy-temporary
          emptyDir: { sizeLimit: 64Mi }
        - name: envoy-config
          configMap: { name: opscustodian-envoy }
        - name: tls
          secret:
            secretName: opscustodian-tls
            defaultMode: 0440
